<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background-color: #f5f5f5; color: #333; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #06C755; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; background-color: #06C755; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; }
  </style>
</head>
<body>
  <div class="card">
    <h2>体験予約フォーム</h2>
    <form id="reserveForm">
      <label>お子様のお名前</label>
      <input type="text" id="name" required placeholder="例：山田 太郎">

      <label>学年</label>
      <select id="grade" required>
        <option value="">選択してください</option>
        <option value="年長以下">年長以下</option>
        <option value="小学1年">小学1年</option>
        <option value="小学2年">小学2年</option>
        <option value="小学3年">小学3年</option>
        <option value="小学4年">小学4年</option>
        <option value="小学5年">小学5年</option>
        <option value="小学6年">小学6年</option>
      </select>

      <label>保護者様のお名前</label>
      <input type="text" id="parentName" required placeholder="例：山田 花子">

      <label>電話番号</label>
      <input type="tel" id="phone" required placeholder="例：090-1234-5678">

      <label>第1希望日時</label>
      <select id="date1" required><option value="">読み込み中...</option></select>

      <label>第2希望日時（任意）</label>
      <select id="date2"><option value="">選択なし</option></select>

      <label>第3希望日時（任意）</label>
      <select id="date3"><option value="">選択なし</option></select>

      <button type="submit" id="submitBtn">予約を申し込む</button>
    </form>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwxckaAoxKE8QJWtM2zqIuvqK7YrtJLGhZVYb3xHYIocK7yV-I-ZNXH5D224Qh3QTvT/exec";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: "2011990307-dg7jyCl3" }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      });

      fetch(GAS_URL + "?action=getDates")
        .then(res => res.json())
        .then(dates => populateDates(dates))
        .catch(err => console.error(err));
    });

    function populateDates(dates) {
      const selects = [document.getElementById('date1'), document.getElementById('date2'), document.getElementById('date3')];
      selects.forEach((select, index) => {
        select.innerHTML = index === 0 ? '<option value="">日時を選択してください</option>' : '<option value="">希望なし</option>';
        if(dates && dates.length > 0) {
          dates.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.time;
            opt.textContent = d.time;
            select.appendChild(opt);
          });
        }
      });
    }

    document.getElementById('reserveForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      const formData = {
        name: document.getElementById('name').value,
        grade: document.getElementById('grade').value,
        parentName: document.getElementById('parentName').value,
        phone: document.getElementById('phone').value,
        date1: document.getElementById('date1').value,
        date2: document.getElementById('date2').value,
        date3: document.getElementById('date3').value
      };

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(res => {
        alert('申込みが完了しました！LINE画面に戻ります。');
        liff.closeWindow();
      })
      .catch(err => {
        alert('送信が完了しました。');
        liff.closeWindow();
      });
    });
  </script>
</body>
</html>
